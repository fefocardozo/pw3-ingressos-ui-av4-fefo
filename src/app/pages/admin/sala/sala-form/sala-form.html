<div class="container mt-4">
  <h2>{{ formSala.value.id ? 'Editar Sala' : 'Nova Sala' }}</h2>

  <form [formGroup]="formSala" (ngSubmit)="save()">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" id="nome" class="form-control" formControlName="nome" />
    </div>

    <div class="mb-3">
      <label for="preco" class="form-label">Preço</label>
      <input type="number" id="preco" class="form-control" formControlName="preco" step="0.01" />
    </div>

    <button type="submit" class="btn btn-success me-2" [disabled]="formSala.invalid">
      Salvar
    </button>
    <a routerLink="/salas" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
